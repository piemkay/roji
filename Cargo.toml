[workspace]
resolver = "3"
members = ["crates/*", "tools/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.dependencies]
roji-domain = { path = "crates/domain" }
roji-parse = { path = "crates/parse" }
roji-store = { path = "crates/store" }
roji-server = { path = "crates/server" }
boundaries = { path = "tools/boundaries" }

anyhow = "1.0.104"
axum = "0.8.9"
cargo_metadata = "0.23.1"
http-body-util = "0.1.5"
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres"] }
syn = { version = "3.0.9", features = ["full", "visit"] }
tokio = { version = "1.53.3", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
